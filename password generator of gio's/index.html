<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KeyForge - Password Generator</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 4 L56 12 V28 C56 44 32 58 32 58 C32 58 8 44 8 28 V12 Z' fill='%230b0f19' stroke='%2300f2fe' stroke-width='4'/%3E%3Ccircle cx='32' cy='26' r='5' fill='%2300f2fe'/%3E%3Cpolygon points='30,29 34,29 35,42 29,42' fill='%2300f2fe'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css">
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Background Animated Glow Effect -->
  <div class="background-glow"></div>

  <!-- Main Card -->
  <main class="card">
    <header class="card-header">
      <div class="shield-icon">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h1>Password Generator</h1>
      <p>Create secure passwords instantly</p>
    </header>

    <!-- Output Field -->
    <div class="output-container">
      <input type="text" id="passwordOutput" readonly placeholder="Click Generate..." aria-label="Generated Password">
      <button id="copyBtn" class="icon-btn" title="Copy Password">
        <i class="fa-regular fa-copy"></i>
      </button>
      <span id="copiedToast" class="copied-toast">Copied!</span>
    </div>

    <!-- Password Strength Indicator -->
    <div class="strength-meter">
      <div class="strength-label">
        <span>Strength</span>
        <strong id="strengthText">Weak</strong>
      </div>
      <div class="meter-bar">
        <div id="meterFill" class="meter-fill"></div>
      </div>
    </div>

    <!-- Character Length Slider -->
    <div class="control-group">
      <div class="label-row">
        <span>Character Length</span>
        <span id="lengthVal" class="badge">16</span>
      </div>
      <input type="range" id="lengthSlider" min="6" max="32" value="16">
    </div>

    <!-- Checkbox Options -->
    <div class="options-grid">
      <label class="toggle-card">
        <input type="checkbox" id="includeUpper" checked>
        <span class="custom-toggle"></span>
        <span class="toggle-label">Uppercase</span>
      </label>

      <label class="toggle-card">
        <input type="checkbox" id="includeLower" checked>
        <span class="custom-toggle"></span>
        <span class="toggle-label">Lowercase</span>
      </label>

      <label class="toggle-card">
        <input type="checkbox" id="includeNumbers" checked>
        <span class="custom-toggle"></span>
        <span class="toggle-label">Numbers</span>
      </label>

      <label class="toggle-card">
        <input type="checkbox" id="includeSymbols" checked>
        <span class="custom-toggle"></span>
        <span class="toggle-label">Symbols</span>
      </label>
    </div>

    <!-- Action Button -->
    <button id="generateBtn" class="primary-btn">
      <span>Generate Password</span>
      <i class="fa-solid fa-wand-magic-sparkles"></i>
    </button>
  </main>

  <script src="script.js"></script>
</body>
</html>
